<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul Pemrograman Web - Herlian Dwi Prianka</title>
    <!-- Tailwind CSS CDN -->
    <style type="text/tailwindcss"></style>
    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            green: '#00ff66',
                            dark: '#0a0f0d',
                            card: '#121c16',
                            border: '#1f3826',
                            glow: '#00ff6655'
                        }
                    },
                    fontFamily: {
                        code: ['Courier New', 'Courier', 'monospace']
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0a0f0d;
            color: #00ff66;
            font-family: 'Courier New', 'Courier', monospace;
        }

        .glow-text {
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
        }

        .glow-box {
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.15);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0f0d;
        }

        ::-webkit-scrollbar-thumb {
            background: #1f3826;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00ff66;
        }
    </style>
</head>

<body class="bg-cyber-dark text-cyber-green min-h-screen selection:bg-cyber-green selection:text-cyber-dark">

    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('modules'); // 'modules' atau 'downloads'
            const [activeGroup, setActiveGroup] = React.useState(1);
            const [copiedIndex, setCopiedIndex] = React.useState(null);

            const [simName, setSimName] = React.useState("Herlian Dwi Prianka");
            const [simDest, setSimDest] = React.useState("Jakarta");
            const [simQty, setSimQty] = React.useState(2);
            const [simMember, setSimMember] = React.useState(true);
            const [calcNum, setCalcNum] = React.useState(15);

            // State untuk Simulasi Marquee Berjalan
            const [marqueeText, setMarqueeText] = React.useState("..............Hallo Gaes! Welcome to my Web, Oiya! Teks ini berjalan btw :v............");

            React.useEffect(() => {
                const timer = setInterval(() => {
                    setMarqueeText(prev => prev.substring(1) + prev.substring(0, 1));
                }, 80);
                return () => clearInterval(timer);
            }, []);

            // Daftar file download pertemuan 1 - 21
            const downloadItems = [
                { no: 1, title: "Pertemuan 1: Pengantar Pemrograman Web & HTML Dasar", filename: "Source/Mentah/Pertemuan 1 Java Web.pptx" },
                { no: 2, title: "Pertemuan 2: Struktur Dokumen HTML & Format Teks Lanjutan", filename: "Source/Mentah/Pertemuan 2 - Java Web.pdf" },
                { no: 3, title: "Pertemuan 3: Pengenalan Tabel dan Hyperlink dalam HTML", filename: "Source/Mentah/Pertemuan 3 - Java Web.pdf" },
                { no: 4, title: "Pertemuan 4: Formulir HTML dan Elemen Input Dasar", filename: "Source/Mentah/Pertemuan 4 - Java Web.pdf" },
                { no: 5, title: "Pertemuan 5: Pengenalan Dasar Cascading Style Sheets (CSS)", filename: "Source/Mentah/Pertemuan 5 - Java Web.pptx" },
                { no: 6, title: "Pertemuan 6: Pengaturan Selector, Warna, dan Font pada CSS", filename: "Source/Mentah/Pertemuan 6 - Java Web.pdf" },
                { no: 7, title: "Pertemuan 7: Box Model: Padding, Margin, dan Border CSS", filename: "Source/Mentah/Pertemuan 7 - Java Web.pptx" },
                { no: 8, title: "Pertemuan 8: Layouting dan Posisi Elemen CSS", filename: "Source/Mentah/Pertemuan 8 - Java Web.pptx" },
                { no: 9, title: "Pertemuan 9: Review dan Latihan Pembuatan Halaman Web Statis", filename: "Source/Mentah/Pertemuan 9 - Java Web.pptx" },
                { no: 10, title: "Pertemuan 10: Persiapan Lingkungan Kerja JavaScript dan Browser Console", filename: "Source/Mentah/Pertemuan 10 - Java Web.pptx" },
                { no: 11, title: "Pertemuan 11: JavaScript: Dasar, Variabel, & Fungsi", filename: "Source/Mentah/Pertemuan 11- Java Web.pptx" },
                { no: 12, title: "Pertemuan 12: Objek JavaScript: Array, Date, & Math", filename: "Source/Mentah/Pertemuan 12 - java web.pptx" },
                { no: 13, title: "Pertemuan 13: Objek JavaScript (1): String, Document, & Window", filename: "Source/Mentah/Pertemuan 13 - Java Web.pptx" },
                { no: 14, title: "Pertemuan 14: Dasar-dasar JSP (Java Server Pages) & Arsitektur", filename: "Source/Mentah/Pertemuan 14 - Java Web.pptx" },
                { no: 15, title: "Pertemuan 15: Kejadian (Event) pada JavaScript", filename: "Source/Mentah/Pertemuan 15 - Java Web.pptx" },
                { no: 16, title: "Pertemuan 16: JavaScript: Obyek String, Date, & Array Lanjutan", filename: "Source/Mentah/Pertemuan 16 - Java Web.pptx" },
                { no: 17, title: "Pertemuan 17: Case Style Sheet (CSS) Implementation", filename: "Source/Mentah/pertemuan 17 - java web fix.pptx" },
                { no: 18, title: "Pertemuan 18: Objek JavaScript (2) & Manipulasi Lanjutan", filename: "Source/Mentah/Pertemuan 18 Java Web.pptx" },
                { no: 19, title: "Pertemuan 19: Marquee dan Frame dalam Web", filename: "Source/Mentah/Pertemuan 19 - Java Web.pptx" },
                { no: 20, title: "Pertemuan 20: Pengenalan Java Web Programming, MVC, & Spring", filename: "Source/Mentah/Pertemuan 20 - Java Web.pptx" },
                { no: 21, title: "Pertemuan 21: Deployment Aplikasi Java Web & Project Akhir", filename: "Source/Mentah/Pertemuan 21 - java Web.pptx" }
            ];

            const moduleGroups = [
                {
                    id: 1,
                    title: "Pertemuan 1-5 : Konsep Dasar Web, HTML & PHP Pengantar (Pertemuan 1 - 5)",
                    description: "Pengenalan arsitektur website, struktur dasar HTML, pembuatan tabel, konsep server-side dengan PHP, variabel, tipe data, serta operator dasar.",
                    items: [
                        {
                            pertemuan: "Pertemuan 1 - 2",
                            title: "Konsep Dasar Web & Struktur HTML",
                            summary: "Mempelajari jenis website (statis, dinamis, interaktif), struktur navigasi, serta tag dasar penulisan dokumen HTML standar menggunakan XAMPP & Apache.",
                            code: `<!DOCTYPE html>
<html>
<head>
    <title>Modul 1 - HTML Dasar</title>
</head>
<body>
    <h1>Sistem Informasi Web</h1>
    <p>Selamat Datang di Modul Pemrograman Web.</p>
<\/body>
</html>`,
                            outputType: "html",
                            outputContent: "<div style='padding:10px; border:1px dashed #00ff66;'><h3>Sistem Informasi Web</h3><p>Selamat Datang di Modul Pemrograman Web.</p></div>"
                        },
                        {
                            pertemuan: "Pertemuan 3 - 4",
                            title: "Dasar PHP, Variabel & Operator",
                            summary: "Mempelajari cara kerja skrip server-side PHP, pendefinisian variabel dengan tanda $, tipe data, serta operator aritmatika, perbandingan, dan logika.",
                            code: `<?php
$nama = "Herlian Dwi Prianka";
$nim = "251091700200";
$sisi = 15;
$volume =$sisi * $sisi * $sisi;

echo "Mahasiswa: $nama<br>";
echo "NIM: $nim<br>";
echo "Volume Kubus (sisi 15): $volume cm3";
?>`,
                            outputType: "php_calc"
                        },
                        {
                            pertemuan: "Pertemuan 5",
                            title: "Form Handling (Metode GET & POST)",
                            summary: "Mempelajari cara menerima dan mengolah data masukan dari form HTML menggunakan superglobal $_GET dan$_POST di PHP.",
                            code: `<form action="proses.php" method="POST">
    Nama: <input type="text" name="nama">
    <input type="submit" value="Kirim">
</form>

<?php
if(isset($_POST['nama'])) {
    echo "Halo, " . $_POST['nama'];
}
?>`,
                            outputType: "form_sim"
                        }
                    ]
                },
                {
                    id: 2,
                    title: "Pertemuan 6-10: Percabangan, Perulangan & JavaScript Dasar (Pertemuan 6 - 10)",
                    description: "Penerapan logika percabangan (if-else, switch), perulangan (for, while, foreach), pengenalan JavaScript sisi client, serta dasar CSS Box Model.",
                    items: [
                        {
                            pertemuan: "Pertemuan 6",
                            title: "Percabangan & Studi Kasus Travel",
                            summary: "Penerapan kondisi if-else majemuk dan switch-case untuk menghitung diskon member, harga tiket berdasarkan tujuan, dan konversi nilai akademik.",
                            code: `<?php
$tujuan = "Jakarta";
$member = true;
$harga = ($tujuan == "Jakarta") ? 100000 : 150000;
$diskon =$member ? (0.1 * $harga) : 0;
$total = $harga -$diskon;

echo "Total Bayar: Rp " . $total;
?>`,
                            outputType: "travel_sim"
                        },
                        {
                            pertemuan: "Pertemuan 7 - 8",
                            title: "Struktur Perulangan & JavaScript",
                            summary: "Penggunaan perulangan for, while, do-while, dan foreach pada array di PHP, serta pengenalan dasar sintaks JavaScript di browser.",
                            code: `// Contoh Perulangan For di PHP
for($i = 1; $i <= 5; $i++) {
    echo "Baris ke-$i <br>";
}

// Contoh JavaScript Sederhana
<script>
    alert("Inisialisasi Sistem JavaScript Aktif!");
<\\/script>`,
                            outputType: "html",
                            outputContent: "Baris ke-1 <br>Baris ke-2 <br>Baris ke-3 <br>Baris ke-4 <br>Baris ke-5"
                        },
                        {
                            pertemuan: "Pertemuan 9 - 10",
                            title: "CSS Styling & Responsive Web Design",
                            summary: "Pengaturan tata letak menggunakan konsep Box Model (Content, Padding, Border, Margin) serta pembuatan desain web responsif menggunakan Media Queries.",
                            code: `/* Contoh CSS Responsive Media Queries */
.container {
    max-width: 1080px;
    margin: 20px auto;
    background: #121c16;
    padding: 15px;
}
@media screen and (max-width: 780px) {
    .container { width: 100%; }
}`,
                            outputType: "html",
                            outputContent: "<div style='background:#121c16; padding:10px; border:1px solid #00ff66;'>[Simulasi Box Model & Responsive Container Aktif]</div>"
                        }
                    ]
                },
                {
                    id: 3,
                    title: "Pertemuan 11-15: JavaScript Lanjutan & Objek (Pertemuan 11 - 15)",
                    description: "Pendalaman objek bawaan JavaScript seperti Array, Date, Math, String, Document, Window, serta penanganan Event handling.",
                    items: [
                        {
                            pertemuan: "Pertemuan 11 - 12",
                            title: "Objek Array, Date & Math JavaScript",
                            summary: "Memanipulasi tanggal sistem, operasi matematika lanjutan dengan objek Math, dan pengelolaan data berurutan menggunakan objek Array di JavaScript.",
                            code: `var d = new Date();
var tahun = d.getFullYear();
var randomNum = Math.round(Math.random() * 100);

document.write("Tahun Sistem: " + tahun);
document.write("<br>Angka Acak: " + randomNum);`,
                            outputType: "js_math"
                        },
                        {
                            pertemuan: "Pertemuan 13 - 14",
                            title: "Objek String, Document & Pengenalan JSP",
                            summary: "Manipulasi string (substring, toUpperCase, length), pengaturan properti document/window, serta pengenalan dasar arsitektur Java Server Pages (JSP).",
                            code: `var nama = "Herlian Dwi Prianka";
console.log(nama.length); 
console.log(nama.toUpperCase());

// JSP Dasar
<%! int angka = 10; %>
Nilai: <%= angka %>`,
                            outputType: "html",
                            outputContent: "HERLIAN DWI PRIANKA (Panjang: 20 Karakter)"
                        },
                        {
                            pertemuan: "Pertemuan 15",
                            title: "Event Handling JavaScript",
                            summary: "Penggunaan event listener seperti onClick, onBlur, onFocus, onLoad, onMouseOver, dan onMouseOut untuk interaktivitas halaman web.",
                            code: `<button onclick="alert('Akses Diberikan!')">Akses Sistem</button>
<input type="text" onfocus="this.style.background='#1f3826'" onblur="this.style.background='transparent'" placeholder="Fokuskan saya">`,
                            outputType: "html",
outputContent: "<div style='display:flex; flex-direction:column; gap:12px; width:100%; font-family:Courier New, Courier, monospace;'><div style='color:#00ff66; font-size:11px; letter-spacing:1px; text-transform:uppercase;'>Demonstrasi Event Interaktif</div><button onclick=\"alert(&quot;Akses Diberikan!&quot;)\" style='align-self:flex-start; background:#1f3826; color:#00ff66; border:1px solid #00ff66; border-radius:6px; padding:9px 14px; font-family:inherit; font-size:12px; font-weight:bold; cursor:pointer;'>Akses Sistem</button><label style='display:flex; flex-direction:column; gap:6px; color:#9ca3af; font-size:11px;'>Fokuskan kolom untuk mencoba event onFocus<input type='text' onfocus=\"this.style.background='#1f3826'\" onblur=\"this.style.background='transparent'\" placeholder='Fokuskan saya' style='box-sizing:border-box; width:100%; background:transparent; color:#00ff66; border:1px solid #1f3826; border-radius:6px; padding:9px 10px; font-family:inherit; font-size:12px; outline:none;'></label></div>"
                        }
                    ]
                },
                {
                    id: 4,
                    title: "Pertemuan 16-21: Expert JavaScript, CSS Advanced & Framework Java Web (Pertemuan 16 - 21)",
                    description: "Manipulasi lanjutan objek JS, marquee, pembuatan frame, arsitektur MVC (Model-View-Controller), serta pengenalan framework Spring & Java Web.",
                    items: [
                        {
                            pertemuan: "Pertemuan 16 - 17",
                            title: "Advanced JS Objects & CSS Case Style",
                            summary: "Penerapan lanjutan metode objek string/array, serta teknik styling tingkat lanjut menggunakan selector CSS dan pseudo-class (:hover, :active).",
                            code: `// Contoh Pseudo-Class CSS
a:hover {
    color: #00ff66;
    text-shadow: 0 0 5px #00ff66;
}
// JavaScript Match & Substr
var str = "CyberSecurity Web";
document.write(str.substr(0, 5));`,
                            outputType: "html",
                            outputContent: "<b>Cyber</b>"
                        },
                        {
                            pertemuan: "Pertemuan 18 - 19",
                            title: "Marquee, Frame & Advanced Layout",
                            summary: "Membuat teks berjalan (marquee) dengan logika setTimeout JavaScript, serta pengelolaan tata letak multi-frame pada browser.",
                            code: `var pesan = "..............Hallo Gaes! Welcome to my Web, Oiya! Teks ini berjalan btw :v............ ";
function p(){
    document.basis.kotak.value = pesan;
    pesan = pesan.substr(1) + pesan.substr(0, 1);
    setTimeout("p()", 100);
}`,
                            outputType: "marquee_sim"
                        },
                        {
                            pertemuan: "Pertemuan 20 - 21",
                            title: "Arsitektur Java Web, MVC & Spring Framework",
                            summary: "Mempelajari konsep arsitektur Java Web (Servlet & JSP), pola desain MVC (Model-View-Controller), deployment file .war, serta pengenalan Spring Framework.",
                            code: `// Konsep Dasar Controller Servlet (Java)
@WebServlet("/proses")
public class ActionServlet extends HttpServlet {
    protected void doGet(HttpServletRequest req, HttpServletResponse resp) {
        RequestDispatcher rd = req.getRequestDispatcher("home.jsp");
        rd.forward(req, resp);
    }
}`,
                            outputType: "html",
                            outputContent: "[Arsitektur MVC: Request Browser -> Servlet (Controller) -> JavaBean (Model) -> JSP (View)]"
                        }
                    ]
                }
            ];

            const copyToClipboard = (text, idx) => {
                navigator.clipboard.writeText(text);
                setCopiedIndex(idx);
                setTimeout(() => setCopiedIndex(null), 2000);
            };

            return (
                <div className="max-w-6xl mx-auto px-4 py-8">
                    <header className="border border-cyber-border bg-cyber-card p-6 rounded-lg glow-box mb-10 relative overflow-hidden">
                        <div className="absolute top-0 right-0 bg-cyber-green text-cyber-dark text-xs font-bold px-3 py-1 uppercase tracking-widest">
                            SECURE // ACCESS GRANTED
                        </div>
                        <div className="flex flex-col md:flex-row items-center gap-6">
                            <div className="relative group">
                                <div className="absolute -inset-1 bg-cyber-green rounded-full blur opacity-40 group-hover:opacity-100 transition duration-1000"></div>
                                <div className="relative w-32 h-32 rounded-full border-2 border-cyber-green overflow-hidden bg-cyber-dark flex items-center justify-center">
                                    <img
                                        src="Assets/Images/Image.jpg"
                                        alt="Herlian Dwi Prianka"
                                        className="w-full h-full object-cover filter contrast-125"
                                        onError={(e) => { e.target.src = 'Assets/Images/Image.jpg' }}
                                    />
                                </div>
                            </div>

                            <div className="text-center md:text-left space-y-2 flex-1">
                                <div className="text-xs text-emerald-400 font-mono tracking-widest">[SYSTEM_OPERATOR_PROFILE]</div>
                                <h1 className="text-3xl md:text-4xl font-bold glow-text tracking-wider">HERLIAN DWI PRIANKA</h1>
                                <div className="flex flex-wrap justify-center md:justify-start gap-4 text-sm font-mono text-emerald-300">
                                    <span className="bg-cyber-dark border border-cyber-border px-3 py-1 rounded">
                                        <i className="fa-solid fa-id-card mr-2"></i>NIM: 251091700200
                                    </span>
                                    <span className="bg-cyber-dark border border-cyber-border px-3 py-1 rounded">
                                        <i className="fa-solid fa-terminal mr-2"></i>MODULE: PEMROGRAMAN WEB (1 - 21)
                                    </span>
                                </div>
                                <p className="text-xs text-gray-400 mt-2 font-mono">
                                    &gt; Root access initialized. Interactive modular archive ready for deployment.
                                </p>
                            </div>
                        </div>
                    </header>
                    <div className="flex border-b border-cyber-border mb-8 font-mono">
                        <button
                            onClick={() => setActiveTab('modules')}
                            className={`flex-1 py-3 px-4 text-center text-sm font-bold border-b-2 transition-all ${activeTab === 'modules'
                                ? 'border-cyber-green text-cyber-green bg-cyber-card'
                                : 'border-transparent text-gray-400 hover:text-cyber-green'
                                }`}
                        >
                            <i className="fa-solid fa-book-open mr-2"></i> MODUL PEMBELAJARAN
                        </button>
                        <button
                            onClick={() => setActiveTab('downloads')}
                            className={`flex-1 py-3 px-4 text-center text-sm font-bold border-b-2 transition-all ${activeTab === 'downloads'
                                ? 'border-cyber-green text-cyber-green bg-cyber-card'
                                : 'border-transparent text-gray-400 hover:text-cyber-green'
                                }`}
                        >
                            <i className="fa-solid fa-download mr-2"></i> TAB DOWNLOAD MATERI (1 - 21)
                        </button>
                    </div>

                    {activeTab === 'downloads' && (
                        <div className="space-y-6">
                            <div className="border-l-4 border-cyber-green pl-4 py-1 bg-cyber-card/50 rounded-r">
                                <h2 className="text-xl font-bold glow-text">Arsip Unduhan File Materi Perkuliahan</h2>
                                <p className="text-sm text-gray-300 font-mono mt-1">Daftar file materi lengkap dan berurutan dari pertemuan 1 sampai dengan pertemuan 21.</p>
                            </div>

                            <div className="grid grid-cols-1 gap-3">
                                {downloadItems.map((item) => (
                                    <div key={item.no} className="border border-cyber-border bg-cyber-card rounded-lg p-4 flex flex-col md:flex-row items-center justify-between gap-4 glow-box">
                                        <div className="flex items-center gap-3">
                                            <span className="w-8 h-8 rounded bg-emerald-950 border border-cyber-border flex items-center justify-center text-xs font-bold text-cyber-green font-mono">
                                                {item.no}
                                            </span>
                                            <div>
                                                <h3 className="text-sm md:text-base font-bold text-emerald-300 font-mono">{item.title}</h3>
                                                <span className="text-xs text-gray-400 font-mono">File: {item.filename}</span>
                                            </div>
                                        </div>
                                        <a href={item.filename} download className="bg-cyber-green text-cyber-dark px-4 py-2 rounded font-bold text-xs hover:opacity-90 transition">
                                            <i className="fa-solid fa-download mr-2"></i> DOWNLOAD
                                        </a>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {activeTab === 'modules' && (
                        <main className="space-y-8">
                            {moduleGroups.filter(g => g.id === activeGroup).map((group) => (
                                <div key={group.id} className="space-y-6">
                                    <div className="border-l-4 border-cyber-green pl-4 py-1 bg-cyber-card/50 rounded-r">
                                        <h2 className="text-xl font-bold glow-text">{group.title}</h2>
                                        <p className="text-sm text-gray-300 font-mono mt-1">{group.description}</p>
                                    </div>

                                    <nav className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
                                        {moduleGroups.map((groupItem) => (
                                            <button
                                                key={groupItem.id}
                                                onClick={() => setActiveGroup(groupItem.id)}
                                                className={`p-3 text-xs md:text-sm font-mono border rounded transition-all duration-300 text-left flex flex-col justify-between ${activeGroup === groupItem.id
                                                    ? 'bg-cyber-green text-cyber-dark border-cyber-green font-bold shadow-lg shadow-emerald-900/50'
                                                    : 'bg-cyber-card text-cyber-green border-cyber-border hover:border-cyber-green'
                                                    }`}
                                            >
                                                <span className="opacity-75 text-[10px]">BLOK {groupItem.id}</span>
                                                <span className="mt-1 truncate">{groupItem.title.split(':')[0]}</span>
                                            </button>
                                        ))}
                                    </nav>

                                    <div className="grid grid-cols-1 gap-6">
                                        {group.items.map((item, idx) => {
                                            const globalIdx = `${group.id}-${idx}`;
                                            return (
                                                <div key={idx} className="border border-cyber-border bg-cyber-card rounded-lg p-5 glow-box">
                                                    <div className="flex flex-col md:flex-row md:items-center justify-between border-b border-cyber-border pb-3 mb-4 gap-2">
                                                        <div>
                                                            <span className="text-xs bg-emerald-950 text-cyber-green border border-cyber-border px-2 py-0.5 rounded font-mono mr-2">
                                                                {item.pertemuan}
                                                            </span>
                                                            <h3 className="text-lg font-bold inline-block text-emerald-300">{item.title}</h3>
                                                        </div>
                                                    </div>

                                                    <p className="text-sm text-gray-300 mb-4 font-mono leading-relaxed">
                                                        {item.summary}
                                                    </p>

                                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                                        <div className="relative bg-black/60 border border-cyber-border rounded p-4 font-code text-xs overflow-x-auto">
                                                            <div className="flex justify-between items-center mb-2 pb-2 border-b border-gray-800 text-gray-400">
                                                                <span><i className="fa-solid fa-code mr-1"></i> SOURCE_CODE.txt</span>
                                                                <button
                                                                    onClick={() => copyToClipboard(item.code, globalIdx)}
                                                                    className="bg-cyber-border hover:bg-cyber-green hover:text-cyber-dark text-cyber-green px-2 py-1 rounded transition text-[10px] flex items-center gap-1 font-mono"
                                                                >
                                                                    <i className={`fa-solid ${copiedIndex === globalIdx ? 'fa-check' : 'fa-copy'}`}></i>
                                                                    {copiedIndex === globalIdx ? 'COPIED!' : 'SALIN KODE'}
                                                                </button>
                                                            </div>
                                                            <pre className="text-emerald-400 whitespace-pre-wrap">{item.code}</pre>
                                                        </div>

                                                        <div className="bg-cyber-dark border border-cyber-border rounded p-4 flex flex-col justify-between">
                                                            <div>
                                                                <div className="text-xs text-gray-400 mb-2 pb-2 border-b border-cyber-border font-mono flex items-center justify-between">
                                                                    <span><i className="fa-solid fa-desktop mr-1 text-cyber-green"></i> SIMULASI_OUTPUT</span>
                                                                    <span className="inline-block w-2 h-2 rounded-full bg-cyber-green animate-ping"></span>
                                                                </div>
                                                                <div className="my-2 p-3 bg-black/40 border border-cyber-border rounded text-sm min-h-[100px] flex flex-col justify-center">
                                                                    {item.outputType === 'html' && (
                                                                        <div dangerouslySetInnerHTML={{ __html: item.outputContent }} />
                                                                    )}
                                                                    {item.outputType === 'php_calc' && (
                                                                        <div className="space-y-1 font-mono text-xs">
                                                                            <p><span className="text-gray-400">Mahasiswa:</span> Herlian Dwi Prianka</p>
                                                                            <p><span className="text-gray-400">NIM:</span> 251091700200</p>
                                                                            <p><span className="text-gray-400">Sisi Kubus:</span> {calcNum} cm</p>
                                                                            <p className="text-cyber-green font-bold">Volume: {calcNum * calcNum * calcNum} cm3</p>
                                                                            <div className="mt-2">
                                                                                <label className="text-[10px] text-gray-400">Ubah Sisi Kubus:</label>
                                                                                <input
                                                                                    type="range" min="5" max="30" value={calcNum}
                                                                                    onChange={(e) => setCalcNum(Number(e.target.value))}
                                                                                    className="w-full accent-cyber-green cursor-pointer"
                                                                                />
                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                    {item.outputType === 'form_sim' && (
                                                                        <div className="space-y-2 text-xs font-mono">
                                                                            <div className="text-emerald-400 font-bold">&gt; Simulasi Form POST:</div>
                                                                            <input
                                                                                type="text" value={simName}
                                                                                onChange={(e) => setSimName(e.target.value)}
                                                                                className="w-full bg-black border border-cyber-border p-1 rounded text-cyber-green"
                                                                            />
                                                                            <div className="p-2 bg-emerald-950/40 border border-cyber-border rounded text-cyber-green">
                                                                                Hasil Tangkapan Server: <b>Halo, {simName}! Data berhasil diproses.</b>
                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                    {item.outputType === 'travel_sim' && (
                                                                        <div className="space-y-2 text-xs font-mono">
                                                                            <div className="text-emerald-400 font-bold">&gt; Simulasi Travel Bintang Abadi:</div>
                                                                            <div className="flex gap-2">
                                                                                <select
                                                                                    value={simDest} onChange={(e) => setSimDest(e.target.value)}
                                                                                    className="bg-black border border-cyber-border p-1 text-xs rounded text-cyber-green"
                                                                                >
                                                                                    <option value="Jakarta">Jakarta (Rp 100k)</option>
                                                                                    <option value="Cirebon">Cirebon (Rp 150k)</option>
                                                                                </select>
                                                                                <input
                                                                                    type="number" value={simQty} min="1" max="10"
                                                                                    onChange={(e) => setSimQty(Number(e.target.value))}
                                                                                    className="w-16 bg-black border border-cyber-border p-1 rounded text-cyber-green text-center"
                                                                                />
                                                                            </div>
                                                                            <div className="flex items-center gap-2">
                                                                                <input
                                                                                    type="checkbox" checked={simMember}
                                                                                    onChange={(e) => setSimMember(e.target.checked)}
                                                                                    id={`chk-${globalIdx}`}
                                                                                    className="accent-cyber-green"
                                                                                />
                                                                                <label htmlFor={`chk-${globalIdx}`}>Member (Diskon 10%)</label>
                                                                            </div>
                                                                            <div className="p-2 bg-emerald-950/40 border border-cyber-border rounded text-cyber-green">
                                                                                Subtotal: Rp {simQty * (simDest === 'Jakarta' ? 100000 : 150000)} <br />
                                                                                Diskon: Rp {simMember ? (simQty * (simDest === 'Jakarta' ? 100000 : 150000) * 0.1) : 0} <br />
                                                                                <b>Total Bayar: Rp {(simQty * (simDest === 'Jakarta' ? 100000 : 150000)) - (simMember ? (simQty * (simDest === 'Jakarta' ? 100000 : 150000) * 0.1) : 0)}</b>
                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                    {item.outputType === 'js_math' && (
                                                                        <div className="text-xs font-mono space-y-1">
                                                                            <p>Tahun Sistem: <b>{new Date().getFullYear()}</b></p>
                                                                            <p>Random Visitor ID: <b>{Math.round(Math.random() * 50000)}</b></p>
                                                                            <p>Akar Kuadrat (144): <b>{Math.sqrt(144)}</b></p>
                                                                        </div>
                                                                    )}
                                                                    {item.outputType === 'marquee_sim' && (
                                                                        <div className="space-y-2 text-xs font-mono">
                                                                            <div className="text-emerald-400 font-bold">&gt; Simulasi Marquee:</div>
                                                                            <div className="overflow-hidden border border-cyber-border bg-black/30 rounded p-2">
                                                                                <div className="whitespace-nowrap text-cyber-green">{marqueeText}</div>
                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                            <div className="text-[10px] text-gray-500 text-right font-mono mt-2">
                                                                STATUS: LIVE_SIMULATION_ACTIVE
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </main>
                    )}

                    <footer className="mt-16 border-t border-cyber-border pt-6 text-center text-xs font-mono text-gray-400">
                        <p>&copy; 2026 CyberModule System // Developed by <span className="text-cyber-green font-bold">Herlian Dwi Prianka</span> (NIM: 251091700200)</p>
                        <p className="mt-1 text-[10px] text-gray-600">All rights reserved. Secured under local server environment.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
